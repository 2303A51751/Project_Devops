name: Property Rental Platform CI/CD

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Tests & Linting
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci
        working-directory: backend

      - name: Run Backend Jest Test Suite (16 Tests)
        run: npm test
        working-directory: backend
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/property_rental_test
          JWT_SECRET: test_super_secret_jwt_key_2026

  frontend-test:
    name: Frontend Tests & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: frontend

      - name: Run Frontend Vitest Test Suite (4 Tests)
        run: npm test
        working-directory: frontend

      - name: Build Production Frontend Bundle (Vite)
        run: npm run build
        working-directory: frontend

  docker-lint:
    name: Dockerfile & Manifest Validation
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Backend Dockerfile
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: property-rental-backend:ci-check

      - name: Validate Frontend Dockerfile
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: property-rental-frontend:ci-check
